name: Build HLK-AL00 vmlinux

# 目的：在云端编译与真机匹配的内核镜像（vmlinux.elf），用于反汇编取偏移。
#
# 为什么用云：
#   本机 WSL 只有 9GB 内存，LTO 链接需 8+GB，反复 OOM。
#   GitHub runner 16GB 内存 + 可直连 android.googlesource.com（本机不可达）。
#
# 源码来源：
#   华为官方开源包，通过 Release 资产分发（560MB，不进 git 历史）。

on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        description: '存放源码 tarball 的 Release tag'
        required: false
        default: 'source-v1'
      source_asset_name:
        description: 'Release 中的源码资产文件名'
        required: false
        default: 'HLK-AL00-AL00a_02_HM_opensource.tar.gz'

permissions:
  contents: read

env:
  # runner 用户对 /work 无写权限；用 HOME 下的目录
  WORK: ${{ github.workspace }}/_work

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "=== runner ==="
          uname -a
          nproc
          free -g
          df -h /
          echo "=== 工具 ==="
          python3 --version
          git --version
          echo "=== 工作目录 ==="
          echo "WORK=$WORK"
          mkdir -p "$WORK"
          touch "$WORK/.writetest" && echo "可写 ✅" && rm -f "$WORK/.writetest"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            flex bison cpio libssl-dev libelf-dev bc rsync unzip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          echo "--- 验证 ---"
          for t in flex bison cpio bc; do printf '%-8s %s\n' "$t" "$(command -v $t || echo MISSING)"; done

      - name: 下载源码包（Release 资产）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.source_release_tag }}
          ASSET: ${{ inputs.source_asset_name }}
        run: |
          mkdir -p "$WORK"
          echo "从 Release 下载: $TAG / $ASSET"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --dir "$WORK" \
            --clobber
          ls -lh "$WORK"
          echo "--- 校验（期望 190000a724ac4556...）---"
          sha256sum "$WORK"/*.tar.gz

      - name: 检查工具链源可达性
        run: |
          set +e
          for u in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86" \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"; do
            printf '%-95s ' "$u"
            timeout 25 git ls-remote --heads "$u" >/dev/null 2>&1 && echo OK || echo FAIL
          done
          set -e

      - name: 构建 vmlinux
        env:
          WORK: ${{ env.WORK }}
        run: |
          chmod +x scripts/build_kernel.sh
          # 脚本用 $SCRIPT_DIR（自身所在目录）定位修复脚本，无需复制到 /action
          sudo -E bash scripts/build_kernel.sh \
            "$WORK/${{ inputs.source_asset_name }}" \
            "$WORK/out"

      - name: 产物概要
        if: always()
        run: |
          echo "=== $WORK/out ==="
          ls -la "$WORK/out" 2>&1 || true
          if [ -f "$WORK/out/vmlinux" ]; then
            echo "--- vmlinux ---"
            ls -lh "$WORK/out/vmlinux"
            sha256sum "$WORK/out/vmlinux"
            readelf -h "$WORK/out/vmlinux" | head -14 || true
            echo "--- 段 ---"
            readelf -S "$WORK/out/vmlinux" | head -20 || true
          fi

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hlk-vmlinux
          path: |
            ${{ env.WORK }}/out/vmlinux
            ${{ env.WORK }}/out/System.map
            ${{ env.WORK }}/out/kernel.config.txt
          retention-days: 30
          if-no-files-found: error

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failure
          path: |
            ${{ env.WORK }}/**/*.log
          retention-days: 7
          if-no-files-found: ignore
